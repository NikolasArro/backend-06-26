# ─── Google OAuth2 ────────────────────────────────────────────
spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID:}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET:}

# Spring Security OAuth2 / Keycloak Config
spring.security.oauth2.resourceserver.jwt.issuer-uri=${KEYCLOAK_ISSUER_URI:http://localhost:9090/realms/demo}
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=${KEYCLOAK_JWK_SET_URI:http://localhost:9090/realms/demo/protocol/openid-connect/certs}

# Logging Level
logging.level.org.springframework.security=DEBUG

# Custom JWT Converter Properties
jwt.auth.converter.resource-id=${KEYCLOAK_RESOURCE_ID:backend}
jwt.auth.converter.principle-attribute=${KEYCLOAK_PRINCIPAL_ATTRIBUTE:preferred_username}

spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=10MB
spring.jpa.properties.hibernate.jdbc.lob.non_contextual_creation=true
