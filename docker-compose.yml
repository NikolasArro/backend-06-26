services:
  db:
    image: postgres
    environment:
      POSTGRES_DB: veebipood
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: parool
    ports:
      - "5432:5432"

  redis:
    image: redis
    ports:
      - "6379:6379"

  keycloak:
    container_name: keycloak_demo
    image: quay.io/keycloak/keycloak:25.0.5
    ports:
      - 9090:8080
    environment:
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: password
    volumes:
      - keycloak_data:/opt/keycloak/data
    command:
      - 'start-dev'

  frontend:
    build:
      context: ../frontend0626
      dockerfile: Dockerfile
    ports:
      - "5173:5173"
    volumes:
      - ../frontend0626:/app
      - /app/node_modules
    environment:
      - VITE_API_URL=http://localhost:8080
    depends_on:
      - app

  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: veebipood
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/veebipood
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: parool
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET}
    depends_on:
      - db
      - redis

volumes:
  keycloak_data:
